t:800; display:flex; align-items:center; justify-content:center; margin-top:1px; }\n  .steps .t{ font-size:12.6px; line-height:1.5; color:var(--ink-soft); text-wrap:pretty; }\n  .steps .t b{ font-weight:800; color:var(--ink); }\n\n  .verdict{ border-radius:11px; padding:15px 17px; border:1px solid; }\n  .verdict + .verdict{ margin-top:13px; }\n  .verdict--pass{ background:var(--pass-soft); border-color:var(--pass-line); }\n  .verdict--flag{ background:var(--flag-soft); border-color:var(--flag-line); }\n  .verdict__h{ display:flex; align-items:center; gap:9px; font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }\n  .verdict--pass .verdict__h{ color:var(--pass); }\n  .verdict--flag .verdict__h{ color:var(--flag); }\n  .vmark{ flex:none; width:19px; height:19px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; }\n  .verdict--pass .vmark{ background:var(--pass); }\n  .verdict--flag .vmark{ background:var(--flag); }\n  .vmark svg{ width:11px; height:11px; }\n  .verdict p{ margin-top:9px; font-size:12px; line-height:1.5; color:var(--ink); text-wrap:pretty; }\n\n  .why{ margin-top:20px; background:var(--charcoal); border-radius:12px; padding:19px 24px; }\n  .why .lab{ color:var(--sky-bright); }\n  .why .lab::before{ background:var(--sky); }\n  .why p{ margin-top:10px; font-size:12.6px; line-height:1.58; color:rgba(255,255,255,.82); text-wrap:pretty; }\n  .why p b{ color:#fff; font-weight:700; }\n\n  .rx{ margin-top:26px; padding-top:20px; }\n  .rx__grid{ margin-top:14px; display:grid; grid-template-columns:repeat(3,1fr); gap:0; border-top:1.5px solid var(--ink); }\n  .rx__card{ padding:15px 18px 4px; border-left:1px solid var(--hair); }\n  .rx__card:first-child{ border-left:none; padding-left:0; }\n  .rx__card:last-child{ padding-right:0; }\n  .rx__tier{ font-size:9px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }\n  .rx__card.is-std .rx__tier{ color:var(--sky); }\n  .rx__t{ margin-top:6px; font-size:13px; font-weight:800; line-height:1.18; letter-spacing:-.01em; }\n  .rx__dose{ margin-top:6px; font-size:10.5px; font-weight:800; letter-spacing:.04em; color:var(--sky-deep); text-transform:uppercase; }\n  .rx__d{ margin-top:8px; font-size:11px; line-height:1.48; color:var(--fine); text-wrap:pretty; }\n\n  /* ===== PROGRAMMING ===== */\n  .plans{ margin-top:22px; display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }\n  .plan{ border:1px solid var(--hair); border-radius:13px; overflow:hidden; display:flex; flex-direction:column; }\n  .plan__hd{ background:var(--charcoal); color:#fff; padding:16px 18px; }\n  .plan__freq{ font-family:var(--serif); font-style:italic; font-weight:600; font-size:26px; color:var(--sky-bright); line-height:1; }\n  .plan__split{ margin-top:6px; font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.7); }\n  .plan__body{ padding:6px 18px 16px; }\n  .plan__day{ padding:12px 0; border-top:1px solid var(--hair-soft); }\n  .plan__day:first-child{ border-top:none; }\n  .plan__day .d{ font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--sky-deep); }\n  .plan__day .m{ margin-top:5px; font-size:12px; line-height:1.45; color:var(--ink-soft); font-weight:600; }\n  .reminder{ margin-top:24px; display:flex; gap:16px; align-items:flex-start; background:var(--charcoal); color:#fff; border-radius:13px; padding:18px 24px; }\n  .reminder__bar{ flex:none; width:3px; align-self:stretch; background:var(--sky); border-radius:3px; }\n  .reminder__h{ font-size:11px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--sky-bright); }\n  .reminder__p{ margin-top:8px; font-size:12.2px; line-height:1.5; color:rgba(255,255,255,.8); text-wrap:pretty; }\n  .reminder__p b{ color:#fff; font-weight:700; }\n\n  /* ===== SUMMARY ===== */\n  .sum-note{ margin-top:13px; font-size:13px; line-height:1.5; color:var(--ink-soft); font-weight:500; max-width:92ch; text-wrap:pretty; }\n  .sum-note b{ font-weight:700; color:var(--ink); }\n  .tbl{ width:100%; border-collapse:collapse; margin-top:15px; table-layout:fixed; }\n  .tbl thead th{ background:var(--charcoal); color:#fff; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:800; padding:9px 11px; text-align:left; vertical-align:middle; }\n  .tbl col.c-lift{ width:24%; } .tbl col.c-pat{ width:24%; } .tbl col.c-tr{ width:30%; } .tbl col.c-do{ width:22%; }\n  .tbl td{ border:1px solid var(--hair); padding:13px 12px; vertical-align:middle; }\n  .tbl tbody tr:nth-child(even){ background:var(--paper-soft); }\n  .tbl .sn{ display:flex; align-items:center; gap:9px; }\n  .tbl .sn .num{ flex:none; width:23px; height:23px; border-radius:5px; background:var(--ink); color:#fff; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; }\n  .tbl .sn .name{ font-size:12px; font-weight:800; line-height:1.15; letter-spacing:-.01em; }\n  .tbl .cell{ font-size:11px; line-height:1.4; color:var(--ink-soft); }\n  .tbl .cell.dose{ font-weight:800; color:var(--sky-deep); letter-spacing:.01em; }\n\n  /* ===== CLOSING ===== */\n  .close{ background:var(--charcoal); color:#fff; }\n  .close .pad{ padding:54px 60px 44px; }\n  .close__run{ display:flex; justify-content:space-between; align-items:center; padding-bottom:13px; border-bottom:1.5px solid rgba(255,255,255,.18); }\n  .close__run .l{ font-size:11px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:var(--sky-bright); }\n  .close__run .r{ font-size:10.5px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.45); }\n  .close__body{ flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; padding:6px 0; }\n  .close__eyebrow{ font-size:12px; font-weight:800; letter-spacing:.26em; text-transform:uppercase; color:var(--sky-bright); }\n  .close__title{ margin-top:18px; font-weight:800; font-size:58px; line-height:.98; letter-spacing:-.028em; }\n  .close__title em.acc{ color:var(--sky-bright); }\n  .close__lead{ margin-top:22px; font-size:15.5px; line-height:1.55; color:rgba(255,255,255,.78); max-width:56ch; text-wrap:pretty; }\n  .get__h{ margin-top:32px; font-size:11.5px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:#fff; }\n  .get{ margin-top:16px; display:grid; grid-template-columns:1fr 1fr; gap:13px 30px; }\n  .get__i{ display:flex; gap:11px; align-items:flex-start; }\n  .get__i .ck{ flex:none; width:20px; height:20px; border-radius:50%; background:var(--sky); display:flex; align-items:center; justify-content:center; margin-top:1px; }\n  .get__i .ck svg{ width:11px; height:11px; }\n  .get__i p{ font-size:12.3px; line-height:1.45; color:rgba(255,255,255,.82); text-wrap:pretty; }\n  .cta{ margin-top:36px; display:flex; align-items:center; gap:22px; }\n  .cta__btn{ display:inline-flex; align-items:center; gap:10px; background:var(--sky); color:#fff; text-decoration:none; font-size:16px; font-weight:800; letter-spacing:.01em; padding:18px 30px; border-radius:12px; }\n  .cta__note{ font-size:11.5px; font-weight:600; color:rgba(255,255,255,.5); letter-spacing:.03em; }\n  .close__foot{ margin-top:auto; padding-top:20px; border-top:1px solid rgba(255,255,255,.16); display:flex; gap:16px; align-items:center; }\n  .close__avatar{ flex:none; width:46px; height:46px; border-radius:50%; object-fit:cover; object-position:50% 18%; }\n  .close__foot .meta{ flex:1; }\n  .close__foot .who{ font-size:12px; font-weight:800; letter-spacing:.04em; color:#fff; }\n  .close__foot .disc{ margin-top:4px; font-size:10px; line-height:1.45; color:rgba(255,255,255,.42); letter-spacing:.02em; }\n\n  @media print{\n    @page{ size:Letter; margin:0; }\n    html,body{ background:#fff; padding:0; }\n    .doc{ gap:0; }\n    .page{ box-shadow:none; }\n    .page:not(:last-child){ break-after:page; }\n    /* Undo any runtime fit-to-width scaling so print is full-size. */\n    .page-frame{ width:auto !important; height:auto !important; }\n    .page-frame > .page{ transform:none !important; }\n    *, *::before, *::after{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"doc\">\n  <section class=\"page cover\" data-screen-label=\"Cover\">\n    <div class=\"cover__main\">\n      <div class=\"cv__top\">\n        <div>\n          <div class=\"cv__handle\">@dr.kevinhershberger<\u002Fdiv>\n          <div class=\"cv__site\">khershberger.com<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cv__pill\">Free Resource<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cv__hero\">\n        <div class=\"cv__eyebrow\">Strength Training for the Long Haul<\u002Fdiv>\n        <h1 class=\"cv__title\">The Longevity<em class=\"acc\">Lift Library<\u002Fem><\u002Fh1>\n        <div class=\"cv__rule\"><\u002Fdiv>\n        <p class=\"cv__lead\">The ten lifts I'd want you doing at 40, 60, and 80 — and how to scale each one to where you are right now.<\u002Fp>\n        <div class=\"cv__list\">\n            <div class=\"cv__li\"><span class=\"nn\">01<\u002Fspan><span class=\"tt\">Squat<\u002Fspan><\u002Fdiv>\n            <div class=\"cv__li\"><span class=\"nn\">02<\u002Fspan><span class=\"tt\">Deadlift<\u002Fspan><\u002Fdiv>\n            <div class=\"cv__li\"><span class=\"nn\">03<\u002Fspan><span class=\"tt\">Lunge<\u002Fspan><\u002Fdiv>\n            <div class=\"cv__li\"><span class=\"nn\">04<\u002Fspan><span class=\"tt\">Lateral Lunge<\u002Fspan><\u002Fdiv>\n            <div class=\"cv__li\"><span class=\"nn\">05<\u002Fspan><span class=\"tt\">Horizontal Press<\u002Fspan><\u002Fdiv>\n            <div class=\"cv__li\"><span class=\"nn\">06<\u002Fspan><span class=\"tt\">Overhead Press<\u002Fspan><\u002Fdiv>\n            <div class=\"cv__li\"><span class=\"nn\">07<\u002Fspan><span class=\"tt\">Pull-Up<\u002Fspan><\u002Fdiv>\n            <div class=\"cv__li\"><span class=\"nn\">08<\u002Fspan><span class=\"tt\">Row<\u002Fspan><\u002Fdiv>\n            <div class=\"cv__li\"><span class=\"nn\">09<\u002Fspan><span class=\"tt\">Hip Thrust<\u002Fspan><\u002Fdiv>\n            <div class=\"cv__li\"><span class=\"nn\">10<\u002Fspan><span class=\"tt\">Loaded Carry<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cv__by\">\n          <div class=\"cv__name\">Dr. Kevin Hershberger <span>— DPT, FAAOMPT<\u002Fspan><\u002Fdiv>\n          <div class=\"cv__cred\">Doctor of Physical Therapy · Fellow, American Academy<br>of Orthopedic Manual Physical Therapy<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"cover__photo\"><img src=\"63f76bb0-4ccf-41b6-a788-3d91f7e84002\" alt=\"Dr. Kevin Hershberger\"><\u002Fdiv>\n  <\u002Fsection>\n  <section class=\"page\" data-screen-label=\"Why Lift for Longevity\">\n    <div class=\"pad\">\n      <div class=\"run\"><span class=\"run__brand\">The Longevity Lift Library<\u002Fspan><span class=\"run__ctx\">The Case for Lifting<\u002Fspan><\u002Fdiv>\n      <div style=\"margin-top:24px;\">\n        <div class=\"phead\">\n          <span class=\"eyebrow\">Section 01<\u002Fspan>\n          <h2 class=\"ptitle\">Why You Should Lift <em class=\"acc\">for Life<\u002Fem><\u002Fh2>\n        <\u002Fdiv>\n        <p class=\"intro-lead\">I'm not interested in your one-rep max. I'm interested in whether you can get off the floor at 80, carry your own groceries, and take the stairs without thinking about it. That's what this guide trains — the everyday strength that decides how independent you stay as you age.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"causes\">\n        <div class=\"cause\">\n          <div class=\"cause__n\">01<\u002Fdiv>\n          <div class=\"cause__t\">Strength Is the Lever You Control<\u002Fdiv>\n          <p class=\"cause__d\">Muscle mass and strength fall as you age. The good news: they respond to training at every age. Of everything that shapes how you grow older, strength is the piece most in your hands.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"cause\">\n          <div class=\"cause__n\">02<\u002Fdiv>\n          <div class=\"cause__t\">Train Function, Not the Mirror<\u002Fdiv>\n          <p class=\"cause__d\">The things that predict aging well aren't aesthetic — they're functional: leg strength, grip, balance, how fast you walk. This guide trains the movement patterns you actually use, not muscles in isolation.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"cause\">\n          <div class=\"cause__n\">03<\u002Fdiv>\n          <div class=\"cause__t\">Earn the Range, Then Load It<\u002Fdiv>\n          <p class=\"cause__d\">Own a clean rep through a full range before you add weight. Load a good pattern and each lift makes you more durable. Load a bad one and you just reinforce the habits that get people hurt.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"keybox\">\n        <div class=\"keybox__h\">A Menu, Not a Prescription<\u002Fdiv>\n        <p class=\"keybox__p\">You don't need all ten lifts every session. Think of this as a menu built around the six movements your body relies on — <b>squat, hinge, lunge, push, pull, and carry.<\u002Fb> Hit each one across your week and you've covered your whole body. From there, pick the lifts and the levels that fit your equipment, your joints, and where you are today.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"howto\">\n        <div class=\"howto__h\">How to Use This Guide<\u002Fdiv>\n        <div class=\"howto__grid\">\n          <div class=\"howto__step\"><span class=\"b\">1<\u002Fspan><p>Train these patterns <b>2–4× a week.<\u002Fb> Pick lifts that cover all six.<\u002Fp><\u002Fdiv>\n          <div class=\"howto__step\"><span class=\"b\">2<\u002Fspan><p>Use a load you can control with clean form. Aim for <b>2–4 sets of 6–12 reps,<\u002Fb> slow and controlled, unless a lift says otherwise.<\u002Fp><\u002Fdiv>\n          <div class=\"howto__step\"><span class=\"b\">3<\u002Fspan><p>Start where you are. Every lift has an easier and a harder version. Own the one you can do today, then build from there.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pagenum\"><span>khershberger.com<\u002Fspan><span>02 / 15<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section class=\"page\" data-screen-label=\"Lift 1 — The Squat\">\n    <div class=\"pad\">\n      <div class=\"run\"><span class=\"run__brand\">The Longevity Lift Library<\u002Fspan><span class=\"run__ctx\">Lift 1 of 10<\u002Fspan><\u002Fdiv>\n      <div class=\"sc-head\">\n        <div class=\"sc-badge\">1<\u002Fdiv>\n        <div>\n          <div class=\"sc-head__cat\">Lower Body · Squat Pattern<\u002Fdiv>\n          <h2 class=\"sc-title\"><em class=\"acc\">Squat<\u002Fem><\u002Fh2>\n          <div class=\"sc-var\">Goblet · Front · Back<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"musc\"><span>Quads<\u002Fspan><span>Glutes<\u002Fspan><span>Core<\u002Fspan><span>Ankles<\u002Fspan><\u002Fdiv>\n      <div class=\"sc-hr\"><\u002Fdiv>\n      <div class=\"sc-grid\">\n        <div>\n          <h3 class=\"lab\">How to Perform It<\u002Fh3>\n          <ol class=\"steps\" style=\"margin-top:12px;\">\n            <li><span class=\"n\">1<\u002Fspan><span class=\"t\">Set your feet shoulder-width with toes turned out 10–20°. Screw your feet into the floor to build tension through the hips.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">2<\u002Fspan><span class=\"t\">Drive your knees out over your toes and descend until your hip crease drops below your knee, heels glued to the floor.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">3<\u002Fspan><span class=\"t\">Stand by pushing the floor away and squeezing your glutes at the top. Control the descent — never just drop.<\u002Fspan><\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n        <div>\n          <div class=\"verdict verdict--pass\">\n            <div class=\"verdict__h\"><span class=\"vmark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan> The Coaching Cue<\u002Fdiv>\n            <p>Knees track over toes, heels stay down, and spine stays in a neutral position. Depth comes from the hips and ankles — not from rounding the low back.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"verdict verdict--flag\">\n            <div class=\"verdict__h\"><span class=\"vmark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><\u002Fsvg><\u002Fspan> Common Mistake<\u002Fdiv>\n            <p>Heels lifting or knees caving inward. Both usually trace back to stiff ankles or weak glutes — fix the mobility, don’t just force the depth.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"why\">\n        <h3 class=\"lab\">Why It Matters for Longevity<\u002Fh3>\n        <p>Every time you stand up from a chair or off the floor, you're squatting. It's one of the most repeated movements in your day, and in aging research, how easily someone rises from a seated position is one of the better predictors of staying independent. Keep the pattern strong now and you keep it for decades.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"rx\">\n        <h3 class=\"lab\">Scale It to You<\u002Fh3>\n        <div class=\"rx__grid\">\n          <div class=\"rx__card\">\n            <div class=\"rx__tier\">Easier<\u002Fdiv>\n            <div class=\"rx__t\">Box / Chair Squat<\u002Fdiv>\n            <div class=\"rx__dose\">2–3 × 8–10<\u002Fdiv>\n            <p class=\"rx__d\">Squat down to lightly touch a bench or chair, then stand. Grooves the pattern and builds confidence in the bottom.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rx__card is-std\">\n            <div class=\"rx__tier\">The Standard<\u002Fdiv>\n            <div class=\"rx__t\">Goblet Squat<\u002Fdiv>\n            <div class=\"rx__dose\">3 × 8–12<\u002Fdiv>\n            <p class=\"rx__d\">Hold a weight at the chest; the counterbalance lets you sit deeper with control. The most joint-friendly place to start loading.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rx__card\">\n            <div class=\"rx__tier\">Harder<\u002Fdiv>\n            <div class=\"rx__t\">Front / Back Squat<\u002Fdiv>\n            <div class=\"rx__dose\">3–4 × 5–8<\u002Fdiv>\n            <p class=\"rx__d\">Load on the front rack or the back for serious, progressive lower-body strength once the pattern is clean.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pagenum\"><span>khershberger.com<\u002Fspan><span>03 / 15<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"page\" data-screen-label=\"Lift 2 — The Deadlift\">\n    <div class=\"pad\">\n      <div class=\"run\"><span class=\"run__brand\">The Longevity Lift Library<\u002Fspan><span class=\"run__ctx\">Lift 2 of 10<\u002Fspan><\u002Fdiv>\n      <div class=\"sc-head\">\n        <div class=\"sc-badge\">2<\u002Fdiv>\n        <div>\n          <div class=\"sc-head__cat\">Lower Body · Hinge Pattern<\u002Fdiv>\n          <h2 class=\"sc-title\"><em class=\"acc\">Deadlift<\u002Fem><\u002Fh2>\n          <div class=\"sc-var\">Trap Bar · Kettlebell · Barbell<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"musc\"><span>Glutes<\u002Fspan><span>Hamstrings<\u002Fspan><span>Back<\u002Fspan><span>Grip<\u002Fspan><\u002Fdiv>\n      <div class=\"sc-hr\"><\u002Fdiv>\n      <div class=\"sc-grid\">\n        <div>\n          <h3 class=\"lab\">How to Perform It<\u002Fh3>\n          <ol class=\"steps\" style=\"margin-top:12px;\">\n            <li><span class=\"n\">1<\u002Fspan><span class=\"t\">Stand with the load over your mid-foot, feet hip-width. Hinge by pushing your hips back with soft knees.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">2<\u002Fspan><span class=\"t\">Take your grip, then pull the slack out of the bar and set a flat, neutral spine — chest up, lats tight.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">3<\u002Fspan><span class=\"t\">Brace hard, then drive the floor away with your legs, keeping the load close to your body the whole way up.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">4<\u002Fspan><span class=\"t\">Finish tall with the glutes squeezed — no leaning back. Reverse the exact same path to lower under control.<\u002Fspan><\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n        <div>\n          <div class=\"verdict verdict--pass\">\n            <div class=\"verdict__h\"><span class=\"vmark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan> The Coaching Cue<\u002Fdiv>\n            <p>The bar travels in a straight vertical line, close to your shins and thighs. Power comes from the legs and hips while the spine stays neutral and braced.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"verdict verdict--flag\">\n            <div class=\"verdict__h\"><span class=\"vmark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><\u002Fsvg><\u002Fspan> Common Mistake<\u002Fdiv>\n            <p>Rounding the low back or yanking the weight up. The back should transmit force, not generate the lift — let the hips and legs do the work.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"why\">\n        <h3 class=\"lab\">Why It Matters for Longevity<\u002Fh3>\n        <p>Every time you pick something up off the ground — a suitcase, a grandkid, a bag of soil — you're hinging. It's also the pattern people get hurt on most, usually because they round the back under load. Train the hinge well and you build the exact strength that keeps lifting from becoming the thing you're afraid of.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"rx\">\n        <h3 class=\"lab\">Scale It to You<\u002Fh3>\n        <div class=\"rx__grid\">\n          <div class=\"rx__card\">\n            <div class=\"rx__tier\">Easier<\u002Fdiv>\n            <div class=\"rx__t\">Elevated / KB Deadlift<\u002Fdiv>\n            <div class=\"rx__dose\">3 × 8<\u002Fdiv>\n            <p class=\"rx__d\">Raise the load on blocks or use a kettlebell to shorten the range while you build the hinge.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rx__card is-std\">\n            <div class=\"rx__tier\">The Standard<\u002Fdiv>\n            <div class=\"rx__t\">Trap-Bar Deadlift<\u002Fdiv>\n            <div class=\"rx__dose\">3 × 6–8<\u002Fdiv>\n            <p class=\"rx__d\">The most spine-friendly entry point — the load sits at your sides, keeping you more upright.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rx__card\">\n            <div class=\"rx__tier\">Harder<\u002Fdiv>\n            <div class=\"rx__t\">Barbell / Romanian DL<\u002Fdiv>\n            <div class=\"rx__dose\">3–4 × 5–6<\u002Fdiv>\n            <p class=\"rx__d\">Full range from the floor, or a loaded hinge that hits the hamstrings and glutes.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pagenum\"><span>khershberger.com<\u002Fspan><span>04 / 15<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"page\" data-screen-label=\"Lift 3 — The Lunge\">\n    <div class=\"pad\">\n      <div class=\"run\"><span class=\"run__brand\">The Longevity Lift Library<\u002Fspan><span class=\"run__ctx\">Lift 3 of 10<\u002Fspan><\u002Fdiv>\n      <div class=\"sc-head\">\n        <div class=\"sc-badge\">3<\u002Fdiv>\n        <div>\n          <div class=\"sc-head__cat\">Lower Body · Single-Leg<\u002Fdiv>\n          <h2 class=\"sc-title\"><em class=\"acc\">Lunge<\u002Fem><\u002Fh2>\n          <div class=\"sc-var\">Reverse · Forward · Walking<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"musc\"><span>Quads<\u002Fspan><span>Glutes<\u002Fspan><span>Hip Stabilizers<\u002Fspan><span>Balance<\u002Fspan><\u002Fdiv>\n      <div class=\"sc-hr\"><\u002Fdiv>\n      <div class=\"sc-grid\">\n        <div>\n          <h3 class=\"lab\">How to Perform It<\u002Fh3>\n          <ol class=\"steps\" style=\"margin-top:12px;\">\n            <li><span class=\"n\">1<\u002Fspan><span class=\"t\">Stand tall. Step one foot back into a long, stable stride (the reverse lunge).<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">2<\u002Fspan><span class=\"t\">Lower straight down until both knees reach about 90° — front shin vertical, back knee hovering just off the floor.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">3<\u002Fspan><span class=\"t\">Keep your torso upright and your weight through the front heel and mid-foot.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">4<\u002Fspan><span class=\"t\">Drive through the front leg to return to standing. Complete all reps, then switch sides.<\u002Fspan><\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n        <div>\n          <div class=\"verdict verdict--pass\">\n            <div class=\"verdict__h\"><span class=\"vmark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan> The Coaching Cue<\u002Fdiv>\n            <p>The front knee tracks over the 2nd and 3rd toes, hips stay square, torso stays tall. The descent is straight down — not pitching forward onto the knee.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"verdict verdict--flag\">\n            <div class=\"verdict__h\"><span class=\"vmark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><\u002Fsvg><\u002Fspan> Common Mistake<\u002Fdiv>\n            <p>Letting the front knee cave inward or the torso fall forward. Shorten the range until you can own it with control before adding depth or load.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"why\">\n        <h3 class=\"lab\">Why It Matters for Longevity<\u002Fh3>\n        <p>Stairs, curbs, catching yourself on uneven ground — that's all single-leg strength. The lunge also tends to expose the left-to-right differences most people don't know they have, which is often where a future hip or knee problem starts. Find the weaker side and you can train it back up.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"rx\">\n        <h3 class=\"lab\">Scale It to You<\u002Fh3>\n        <div class=\"rx__grid\">\n          <div class=\"rx__card\">\n            <div class=\"rx__tier\">Easier<\u002Fdiv>\n            <div class=\"rx__t\">Static Split Squat<\u002Fdiv>\n            <div class=\"rx__dose\">2–3 × 8<\u002Fdiv>\n            <p class=\"rx__d\">Feet planted in a stride, just travel up and down. Hold a support if you need it.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rx__card is-std\">\n            <div class=\"rx__tier\">The Standard<\u002Fdiv>\n            <div class=\"rx__t\">Reverse Lunge<\u002Fdiv>\n            <div class=\"rx__dose\">3 × 8 / side<\u002Fdiv>\n            <p class=\"rx__d\">Stepping back is easier on the knees than stepping forward — the best default for people who have knee pain.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rx__card\">\n            <div class=\"rx__tier\">Harder<\u002Fdiv>\n            <div class=\"rx__t\">Walking / Loaded Lunge<\u002Fdiv>\n            <div class=\"rx__dose\">3 × 10 / side<\u002Fdiv>\n            <p class=\"rx__d\">Add dumbbells or travel through space to load the pattern and challenge balance.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pagenum\"><span>khershberger.com<\u002Fspan><span>05 / 15<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"page\" data-screen-label=\"Lift 4 — The Lateral Lunge\">\n    <div class=\"pad\">\n      <div class=\"run\"><span class=\"run__brand\">The Longevity Lift Library<\u002Fspan><span class=\"run__ctx\">Lift 4 of 10<\u002Fspan><\u002Fdiv>\n      <div class=\"sc-head\">\n        <div class=\"sc-badge\">4<\u002Fdiv>\n        <div>\n          <div class=\"sc-head__cat\">Lower Body · Frontal Plane<\u002Fdiv>\n          <h2 class=\"sc-title\">Lateral <em class=\"acc\">Lunge<\u002Fem><\u002Fh2>\n          <div class=\"sc-var\">Bodyweight · Goblet · Slider<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"musc\"><span>Adductors<\u002Fspan><span>Glutes<\u002Fspan><span>Hip Mobility<\u002Fspan><\u002Fdiv>\n      <div class=\"sc-hr\"><\u002Fdiv>\n      <div class=\"sc-grid\">\n        <div>\n          <h3 class=\"lab\">How to Perform It<\u002Fh3>\n          <ol class=\"steps\" style=\"margin-top:12px;\">\n            <li><span class=\"n\">1<\u002Fspan><span class=\"t\">Stand tall with feet together. Take a wide step directly out to one side.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">2<\u002Fspan><span class=\"t\">Sit back and down into the stepping-side hip, bending that knee while the other leg stays long and straight.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">3<\u002Fspan><span class=\"t\">Keep both feet flat with toes pointing forward as the hips push back.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">4<\u002Fspan><span class=\"t\">Push off the bent leg to return to the start. Move slowly and with control throughout.<\u002Fspan><\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n        <div>\n          <div class=\"verdict verdict--pass\">\n            <div class=\"verdict__h\"><span class=\"vmark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan> The Coaching Cue<\u002Fdiv>\n            <p>Sit into the hip of the bent leg with the knee tracking over the 2nd–3rd toes. The trailing leg stays long.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"verdict verdict--flag\">\n            <div class=\"verdict__h\"><span class=\"vmark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><\u002Fsvg><\u002Fspan> Common Mistake<\u002Fdiv>\n            <p>The bent knee caving inward, or rushing the rep. Keep it slow — the frontal plane is where most people are weakest and least practiced.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"why\">\n        <h3 class=\"lab\">Why It Matters for Longevity<\u002Fh3>\n        <p>Catching a slip, stepping out of the way, getting in and out of a car — those are side-to-side demands, and most training ignores them completely. Almost everything we do in the gym happens straight ahead. Train the frontal plane and your hips are ready for the directions real life actually moves.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"rx\">\n        <h3 class=\"lab\">Scale It to You<\u002Fh3>\n        <div class=\"rx__grid\">\n          <div class=\"rx__card\">\n            <div class=\"rx__tier\">Easier<\u002Fdiv>\n            <div class=\"rx__t\">Assisted Lateral Lunge<\u002Fdiv>\n            <div class=\"rx__dose\">2 × 8 / side<\u002Fdiv>\n            <p class=\"rx__d\">Hold a support and work a partial, comfortable depth while you build hip mobility.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rx__card is-std\">\n            <div class=\"rx__tier\">The Standard<\u002Fdiv>\n            <div class=\"rx__t\">Bodyweight Lateral Lunge<\u002Fdiv>\n            <div class=\"rx__dose\">3 × 8 / side<\u002Fdiv>\n            <p class=\"rx__d\">Slow and controlled to full depth, knee tracking cleanly over the toes.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rx__card\">\n            <div class=\"rx__tier\">Harder<\u002Fdiv>\n            <div class=\"rx__t\">Goblet Lateral Lunge<\u002Fdiv>\n            <div class=\"rx__dose\">3 × 10 / side<\u002Fdiv>\n            <p class=\"rx__d\">Hold a weight at the chest to load the adductors and glutes through range.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pagenum\"><span>khershberger.com<\u002Fspan><span>06 / 15<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"page\" data-screen-label=\"Lift 5 — Horizontal Press\">\n    <div class=\"pad\">\n      <div class=\"run\"><span class=\"run__brand\">The Longevity Lift Library<\u002Fspan><span class=\"run__ctx\">Lift 5 of 10<\u002Fspan><\u002Fdiv>\n      <div class=\"sc-head\">\n        <div class=\"sc-badge\">5<\u002Fdiv>\n        <div>\n          <div class=\"sc-head__cat\">Upper Body · Horizontal Push<\u002Fdiv>\n          <h2 class=\"sc-title\">Horizontal <em class=\"acc\">Press<\u002Fem><\u002Fh2>\n          <div class=\"sc-var\">Push-Up · Bench · Dumbbell<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"musc\"><span>Chest<\u002Fspan><span>Shoulders<\u002Fspan><span>Triceps<\u002Fspan><span>Core<\u002Fspan><\u002Fdiv>\n      <div class=\"sc-hr\"><\u002Fdiv>\n      <div class=\"sc-grid\">\n        <div>\n          <h3 class=\"lab\">How to Perform It<\u002Fh3>\n          <ol class=\"steps\" style=\"margin-top:12px;\">\n            <li><span class=\"n\">1<\u002Fspan><span class=\"t\">Set hands slightly wider than your shoulders, body in one straight line from head to heels.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">2<\u002Fspan><span class=\"t\">Brace your core and glutes so the hips don’t sag. Pull your shoulder blades back and down.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">3<\u002Fspan><span class=\"t\">Lower with control until your chest is just above the floor, elbows at about 45° to your ribs.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">4<\u002Fspan><span class=\"t\">Press the floor away to a full lockout, holding the rigid plank line the entire time.<\u002Fspan><\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n        <div>\n          <div class=\"verdict verdict--pass\">\n            <div class=\"verdict__h\"><span class=\"vmark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan> The Coaching Cue<\u002Fdiv>\n            <p>A rigid, straight-line body with elbows tucked to roughly 45°. Move through the full range with control — chest to just above the floor, then full lockout.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"verdict verdict--flag\">\n            <div class=\"verdict__h\"><span class=\"vmark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><\u002Fsvg><\u002Fspan> Common Mistake<\u002Fdiv>\n            <p>Sagging hips, flaring elbows, or bouncing the bar off the chest. Own the full range under control instead of chasing reps with half-depth.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"why\">\n        <h3 class=\"lab\">Why It Matters for Longevity<\u002Fh3>\n        <p>Pushing yourself up off the floor or out of a low chair is horizontal pressing strength. So is getting back up after a fall. Keep that strength and a stumble stays a stumble — something you get up from on your own.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"rx\">\n        <h3 class=\"lab\">Scale It to You<\u002Fh3>\n        <div class=\"rx__grid\">\n          <div class=\"rx__card\">\n            <div class=\"rx__tier\">Easier<\u002Fdiv>\n            <div class=\"rx__t\">Incline Push-Up<\u002Fdiv>\n            <div class=\"rx__dose\">3 × 8–12<\u002Fdiv>\n            <p class=\"rx__d\">Hands on a bench, counter, or wall to reduce the load while keeping perfect form.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rx__card is-std\">\n            <div class=\"rx__tier\">The Standard<\u002Fdiv>\n            <div class=\"rx__t\">Floor Push-Up<\u002Fdiv>\n            <div class=\"rx__dose\">3 × 8–15<\u002Fdiv>\n            <p class=\"rx__d\">Full range, rigid body, elbows tucked. The most accessible pressing strength builder there is.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rx__card\">\n            <div class=\"rx__tier\">Harder<\u002Fdiv>\n            <div class=\"rx__t\">Bench / DB Press<\u002Fdiv>\n            <div class=\"rx__dose\">3–4 × 6–10<\u002Fdiv>\n            <p class=\"rx__d\">Load it for progressive pressing strength once bodyweight reps are easy.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pagenum\"><span>khershberger.com<\u002Fspan><span>07 / 15<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"page\" data-screen-label=\"Lift 6 — The Overhead Press\">\n    <div class=\"pad\">\n      <div class=\"run\"><span class=\"run__brand\">The Longevity Lift Library<\u002Fspan><span class=\"run__ctx\">Lift 6 of 10<\u002Fspan><\u002Fdiv>\n      <div class=\"sc-head\">\n        <div class=\"sc-badge\">6<\u002Fdiv>\n        <div>\n          <div class=\"sc-head__cat\">Upper Body · Vertical Push<\u002Fdiv>\n          <h2 class=\"sc-title\">Overhead <em class=\"acc\">Press<\u002Fem><\u002Fh2>\n          <div class=\"sc-var\">Dumbbell · Barbell · Landmine<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"musc\"><span>Shoulders<\u002Fspan><span>Upper Back<\u002Fspan><span>Triceps<\u002Fspan><span>Core<\u002Fspan><\u002Fdiv>\n      <div class=\"sc-hr\"><\u002Fdiv>\n      <div class=\"sc-grid\">\n        <div>\n          <h3 class=\"lab\">How to Perform It<\u002Fh3>\n          <ol class=\"steps\" style=\"margin-top:12px;\">\n            <li><span class=\"n\">1<\u002Fspan><span class=\"t\">Stand tall with the weights at shoulder height, elbows slightly in front of the body.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">2<\u002Fspan><span class=\"t\">Brace your core and squeeze your glutes so you don’t arch the low back.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">3<\u002Fspan><span class=\"t\">Press straight overhead, moving your head slightly back and then through as the weights pass your face.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">4<\u002Fspan><span class=\"t\">Finish with arms locked out and biceps near your ears. Lower under control back to the shoulders.<\u002Fspan><\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n        <div>\n          <div class=\"verdict verdict--pass\">\n            <div class=\"verdict__h\"><span class=\"vmark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan> The Coaching Cue<\u002Fdiv>\n            <p>Ribs down, glutes tight, and a straight bar path that finishes with the weight stacked over your mid-foot. The motion comes from the shoulders, not a low-back arch.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"verdict verdict--flag\">\n            <div class=\"verdict__h\"><span class=\"vmark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><\u002Fsvg><\u002Fspan> Common Mistake<\u002Fdiv>\n            <p>Arching the low back to heave the weight up. If you can’t press it without leaning back, the load is too heavy or the shoulder mobility isn’t there yet.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"why\">\n        <h3 class=\"lab\">Why It Matters for Longevity<\u002Fh3>\n        <p>Overhead reach is one of the first things a desk-bound, rounded-forward lifestyle takes from you. Pressing keeps your shoulders both strong and mobile, so reaching the top shelf or the overhead bin stays easy instead of becoming a chore.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"rx\">\n        <h3 class=\"lab\">Scale It to You<\u002Fh3>\n        <div class=\"rx__grid\">\n          <div class=\"rx__card\">\n            <div class=\"rx__tier\">Easier<\u002Fdiv>\n            <div class=\"rx__t\">Landmine / ½-Kneel Press<\u002Fdiv>\n            <div class=\"rx__dose\">3 × 8<\u002Fdiv>\n            <p class=\"rx__d\">A more forgiving angle for stiff shoulders, and the half-kneel removes the low-back cheat.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rx__card is-std\">\n            <div class=\"rx__tier\">The Standard<\u002Fdiv>\n            <div class=\"rx__t\">DB Overhead Press<\u002Fdiv>\n            <div class=\"rx__dose\">3 × 8–10<\u002Fdiv>\n            <p class=\"rx__d\">Independent arms even out left-to-right imbalances — a great default for most people.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rx__card\">\n            <div class=\"rx__tier\">Harder<\u002Fdiv>\n            <div class=\"rx__t\">Barbell Overhead Press<\u002Fdiv>\n            <div class=\"rx__dose\">3–4 × 5–6<\u002Fdiv>\n            <p class=\"rx__d\">The heaviest, most full-body pressing strength once the pattern is owned.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pagenum\"><span>khershberger.com<\u002Fspan><span>08 / 15<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"page\" data-screen-label=\"Lift 7 — The Pull-Up\">\n    <div class=\"pad\">\n      <div class=\"run\"><span class=\"run__brand\">The Longevity Lift Library<\u002Fspan><span class=\"run__ctx\">Lift 7 of 10<\u002Fspan><\u002Fdiv>\n      <div class=\"sc-head\">\n        <div class=\"sc-badge\">7<\u002Fdiv>\n        <div>\n          <div class=\"sc-head__cat\">Upper Body · Vertical Pull<\u002Fdiv>\n          <h2 class=\"sc-title\"><em class=\"acc\">Pull-Up<\u002Fem><\u002Fh2>\n          <div class=\"sc-var\">Assisted · Pulldown · Full<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"musc\"><span>Lats<\u002Fspan><span>Biceps<\u002Fspan><span>Upper Back<\u002Fspan><span>Grip<\u002Fspan><\u002Fdiv>\n      <div class=\"sc-hr\"><\u002Fdiv>\n      <div class=\"sc-grid\">\n        <div>\n          <h3 class=\"lab\">How to Perform It<\u002Fh3>\n          <ol class=\"steps\" style=\"margin-top:12px;\">\n            <li><span class=\"n\">1<\u002Fspan><span class=\"t\">Grip the bar slightly wider than your shoulders, palms forward. Start from a full hang with active shoulders.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">2<\u002Fspan><span class=\"t\">Set your shoulder blades down and back — think about pulling them into your back pockets.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">3<\u002Fspan><span class=\"t\">Drive your elbows down toward your ribs and pull your chest up toward the bar.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">4<\u002Fspan><span class=\"t\">Lower all the way to a full, controlled hang. No swinging or kipping for momentum.<\u002Fspan><\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n        <div>\n          <div class=\"verdict verdict--pass\">\n            <div class=\"verdict__h\"><span class=\"vmark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan> The Coaching Cue<\u002Fdiv>\n            <p>Lead with the shoulder blades, then the elbows — chest up to the bar, full hang at the bottom. Smooth and controlled, never swinging for momentum.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"verdict verdict--flag\">\n            <div class=\"verdict__h\"><span class=\"vmark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><\u002Fsvg><\u002Fspan> Common Mistake<\u002Fdiv>\n            <p>Half-range reps and a dead, passive hang. Pull all the way up and control all the way down — assisted versions count just as much.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"why\">\n        <h3 class=\"lab\">Why It Matters for Longevity<\u002Fh3>\n        <p>The lats attach all the way down at your lower back, so pulling strength supports both your shoulders and your spine. A strong pull is also what lets you haul your own bodyweight up — out of a pool, over a wall, off the ground.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"rx\">\n        <h3 class=\"lab\">Scale It to You<\u002Fh3>\n        <div class=\"rx__grid\">\n          <div class=\"rx__card\">\n            <div class=\"rx__tier\">Easier<\u002Fdiv>\n            <div class=\"rx__t\">Lat Pulldown<\u002Fdiv>\n            <div class=\"rx__dose\">3 × 10–12<\u002Fdiv>\n            <p class=\"rx__d\">Dial the load to exactly your level and groove the pulling pattern.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rx__card is-std\">\n            <div class=\"rx__tier\">The Standard<\u002Fdiv>\n            <div class=\"rx__t\">Assisted Pull-Up<\u002Fdiv>\n            <div class=\"rx__dose\">3 × 6–10<\u002Fdiv>\n            <p class=\"rx__d\">Band- or machine-assisted bodyweight pulls that build toward the real thing.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rx__card\">\n            <div class=\"rx__tier\">Harder<\u002Fdiv>\n            <div class=\"rx__t\">Full Pull-Up<\u002Fdiv>\n            <div class=\"rx__dose\">3–4 × 5–8<\u002Fdiv>\n            <p class=\"rx__d\">Strict reps from a dead hang; add weight once they’re easy.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pagenum\"><span>khershberger.com<\u002Fspan><span>09 / 15<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"page\" data-screen-label=\"Lift 8 — The Row\">\n    <div class=\"pad\">\n      <div class=\"run\"><span class=\"run__brand\">The Longevity Lift Library<\u002Fspan><span class=\"run__ctx\">Lift 8 of 10<\u002Fspan><\u002Fdiv>\n      <div class=\"sc-head\">\n        <div class=\"sc-badge\">8<\u002Fdiv>\n        <div>\n          <div class=\"sc-head__cat\">Upper Body · Horizontal Pull<\u002Fdiv>\n          <h2 class=\"sc-title\"><em class=\"acc\">Row<\u002Fem><\u002Fh2>\n          <div class=\"sc-var\">Cable · Dumbbell · Barbell<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"musc\"><span>Upper Back<\u002Fspan><span>Lats<\u002Fspan><span>Biceps<\u002Fspan><span>Rear Delts<\u002Fspan><\u002Fdiv>\n      <div class=\"sc-hr\"><\u002Fdiv>\n      <div class=\"sc-grid\">\n        <div>\n          <h3 class=\"lab\">How to Perform It<\u002Fh3>\n          <ol class=\"steps\" style=\"margin-top:12px;\">\n            <li><span class=\"n\">1<\u002Fspan><span class=\"t\">Hinge to a flat-back position, or sit tall at a cable. Let the weight hang with the shoulder blade reaching forward.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">2<\u002Fspan><span class=\"t\">Start the pull by drawing the shoulder blade back, then pull the elbow toward your hip.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">3<\u002Fspan><span class=\"t\">Bring the handle to your lower ribs or upper belly, squeezing the mid-back hard.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">4<\u002Fspan><span class=\"t\">Lower with control to a full stretch. Keep the torso still — no jerking or swinging.<\u002Fspan><\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n        <div>\n          <div class=\"verdict verdict--pass\">\n            <div class=\"verdict__h\"><span class=\"vmark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan> The Coaching Cue<\u002Fdiv>\n            <p>Pull with the back, not the arm — shoulder blade first, elbow to the hip, full squeeze. A complete range of motion beats a heavier weight.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"verdict verdict--flag\">\n            <div class=\"verdict__h\"><span class=\"vmark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><\u002Fsvg><\u002Fspan> Common Mistake<\u002Fdiv>\n            <p>Heaving the weight with body english and a short range. Slow it down, feel the mid-back work, and let the upper back — not momentum — move the load.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"why\">\n        <h3 class=\"lab\">Why It Matters for Longevity<\u002Fh3>\n        <p>Your upper back is what holds you upright against gravity and a long day at a desk. Strengthen it and you've got a counter to the rounded, forward-head position that creeps in over years.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"rx\">\n        <h3 class=\"lab\">Scale It to You<\u002Fh3>\n        <div class=\"rx__grid\">\n          <div class=\"rx__card\">\n            <div class=\"rx__tier\">Easier<\u002Fdiv>\n            <div class=\"rx__t\">Supported Cable / Chest Row<\u002Fdiv>\n            <div class=\"rx__dose\">3 × 10–12<\u002Fdiv>\n            <p class=\"rx__d\">Torso braced against a pad, removing any low-back demand so you can focus on the squeeze.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rx__card is-std\">\n            <div class=\"rx__tier\">The Standard<\u002Fdiv>\n            <div class=\"rx__t\">One-Arm DB Row<\u002Fdiv>\n            <div class=\"rx__dose\">3 × 8–12 / side<\u002Fdiv>\n            <p class=\"rx__d\">Full range, one side at a time, to even out imbalances.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rx__card\">\n            <div class=\"rx__tier\">Harder<\u002Fdiv>\n            <div class=\"rx__t\">Barbell Row<\u002Fdiv>\n            <div class=\"rx__dose\">3–4 × 6–8<\u002Fdiv>\n            <p class=\"rx__d\">Heavier bilateral pulling that builds serious upper-back strength.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pagenum\"><span>khershberger.com<\u002Fspan><span>10 / 15<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"page\" data-screen-label=\"Lift 9 — The Hip Thrust\">\n    <div class=\"pad\">\n      <div class=\"run\"><span class=\"run__brand\">The Longevity Lift Library<\u002Fspan><span class=\"run__ctx\">Lift 9 of 10<\u002Fspan><\u002Fdiv>\n      <div class=\"sc-head\">\n        <div class=\"sc-badge\">9<\u002Fdiv>\n        <div>\n          <div class=\"sc-head__cat\">Posterior Chain · Bridge<\u002Fdiv>\n          <h2 class=\"sc-title\">Hip <em class=\"acc\">Thrust<\u002Fem><\u002Fh2>\n          <div class=\"sc-var\">Glute Bridge · Hip Thrust · Single-Leg<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"musc\"><span>Glutes<\u002Fspan><span>Hamstrings<\u002Fspan><span>Posterior Chain<\u002Fspan><\u002Fdiv>\n      <div class=\"sc-hr\"><\u002Fdiv>\n      <div class=\"sc-grid\">\n        <div>\n          <h3 class=\"lab\">How to Perform It<\u002Fh3>\n          <ol class=\"steps\" style=\"margin-top:12px;\">\n            <li><span class=\"n\">1<\u002Fspan><span class=\"t\">Lie on your back, knees bent, feet flat and hip-width with heels near your glutes.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">2<\u002Fspan><span class=\"t\">Tuck your ribs and gently tilt the pelvis to flatten your low back.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">3<\u002Fspan><span class=\"t\">Drive through your heels and squeeze your glutes to lift your hips into a straight line from knees to shoulders.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">4<\u002Fspan><span class=\"t\">Pause and squeeze at the top, then lower with control. Move the hips and ribs together as one unit.<\u002Fspan><\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n        <div>\n          <div class=\"verdict verdict--pass\">\n            <div class=\"verdict__h\"><span class=\"vmark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan> The Coaching Cue<\u002Fdiv>\n            <p>Move the hips and ribs as a single unit and finish with a hard glute squeeze — a straight line from knees to shoulders. The glutes lift you, not the low back.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"verdict verdict--flag\">\n            <div class=\"verdict__h\"><span class=\"vmark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><\u002Fsvg><\u002Fspan> Common Mistake<\u002Fdiv>\n            <p>Over-arching and lifting with the lower back instead of the glutes. Keep the ribs down and the spine neutral so the glutes do the work they’re built for.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"why\">\n        <h3 class=\"lab\">Why It Matters for Longevity<\u002Fh3>\n        <p>When the glutes are weak, the lower back picks up work it wasn't built for — and that's a common driver of the back pain I see in the clinic. Strong glutes drive your walking, your stairs, and every hinge, and they take load off the spine.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"rx\">\n        <h3 class=\"lab\">Scale It to You<\u002Fh3>\n        <div class=\"rx__grid\">\n          <div class=\"rx__card\">\n            <div class=\"rx__tier\">Easier<\u002Fdiv>\n            <div class=\"rx__t\">Bodyweight Glute Bridge<\u002Fdiv>\n            <div class=\"rx__dose\">3 × 12–15<\u002Fdiv>\n            <p class=\"rx__d\">Floor-based — master the squeeze and the neutral-spine position first.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rx__card is-std\">\n            <div class=\"rx__tier\">The Standard<\u002Fdiv>\n            <div class=\"rx__t\">Barbell / DB Hip Thrust<\u002Fdiv>\n            <div class=\"rx__dose\">3 × 8–12<\u002Fdiv>\n            <p class=\"rx__d\">Upper back on a bench, load across the hips, for the strongest glute training there is.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rx__card\">\n            <div class=\"rx__tier\">Harder<\u002Fdiv>\n            <div class=\"rx__t\">Single-Leg Hip Thrust<\u002Fdiv>\n            <div class=\"rx__dose\">3 × 8 / side<\u002Fdiv>\n            <p class=\"rx__d\">One leg at a time exposes and corrects left-to-right asymmetry.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pagenum\"><span>khershberger.com<\u002Fspan><span>11 / 15<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"page\" data-screen-label=\"Lift 10 — The Loaded Carry\">\n    <div class=\"pad\">\n      <div class=\"run\"><span class=\"run__brand\">The Longevity Lift Library<\u002Fspan><span class=\"run__ctx\">Lift 10 of 10<\u002Fspan><\u002Fdiv>\n      <div class=\"sc-head\">\n        <div class=\"sc-badge\">10<\u002Fdiv>\n        <div>\n          <div class=\"sc-head__cat\">Total Body · Loaded Carry<\u002Fdiv>\n          <h2 class=\"sc-title\">Loaded <em class=\"acc\">Carry<\u002Fem><\u002Fh2>\n          <div class=\"sc-var\">Suitcase · Farmer · Mixed<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"musc\"><span>Grip<\u002Fspan><span>Core<\u002Fspan><span>Trunk Stability<\u002Fspan><span>Traps<\u002Fspan><\u002Fdiv>\n      <div class=\"sc-hr\"><\u002Fdiv>\n      <div class=\"sc-grid\">\n        <div>\n          <h3 class=\"lab\">How to Perform It<\u002Fh3>\n          <ol class=\"steps\" style=\"margin-top:12px;\">\n            <li><span class=\"n\">1<\u002Fspan><span class=\"t\">Pick up a heavy weight in one hand (suitcase) or both (farmer).<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">2<\u002Fspan><span class=\"t\">Stand tall: ribs down, shoulders back, chest proud, eyes ahead.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">3<\u002Fspan><span class=\"t\">Brace your core — especially on the suitcase carry, where one side is fighting to tip you over.<\u002Fspan><\u002Fli>\n            <li><span class=\"n\">4<\u002Fspan><span class=\"t\">Walk slow, smooth, controlled steps for the prescribed time or distance, then set the weight down with a hinge.<\u002Fspan><\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n        <div>\n          <div class=\"verdict verdict--pass\">\n            <div class=\"verdict__h\"><span class=\"vmark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan> The Coaching Cue<\u002Fdiv>\n            <p>Walk tall and slow with ribs stacked over hips — no leaning, no rushing. The core stays braced to resist the load pulling you to one side.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"verdict verdict--flag\">\n            <div class=\"verdict__h\"><span class=\"vmark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><\u002Fsvg><\u002Fspan> Common Mistake<\u002Fdiv>\n            <p>Hurrying, hunching, or letting the loaded side pull you into a lean. Slow down — the value is in resisting the tilt with a tall, braced trunk.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"why\">\n        <h3 class=\"lab\">Why It Matters for Longevity<\u002Fh3>\n        <p>Grip strength is one of the most reliable markers in all of aging research — a stand-in for whole-body strength that tracks with both function and how long people live. And hauling groceries, luggage, and kids around is just a loaded carry you're already doing without calling it one.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"rx\">\n        <h3 class=\"lab\">Scale It to You<\u002Fh3>\n        <div class=\"rx__grid\">\n          <div class=\"rx__card\">\n            <div class=\"rx__tier\">Easier<\u002Fdiv>\n            <div class=\"rx__t\">Short Suitcase Carry<\u002Fdiv>\n            <div class=\"rx__dose\">3 trips · 20–30s<\u002Fdiv>\n            <p class=\"rx__d\">A lighter load in one hand for shorter bouts while you build grip and trunk stability.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rx__card is-std\">\n            <div class=\"rx__tier\">The Standard<\u002Fdiv>\n            <div class=\"rx__t\">Suitcase / Farmer Carry<\u002Fdiv>\n            <div class=\"rx__dose\">3 trips · 40–60s<\u002Fdiv>\n            <p class=\"rx__d\">Tall and steady for time per side. The everyday-strength staple.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"rx__card\">\n            <div class=\"rx__tier\">Harder<\u002Fdiv>\n            <div class=\"rx__t\">Heavy Farmer Carry<\u002Fdiv>\n            <div class=\"rx__dose\">3–4 trips<\u002Fdiv>\n            <p class=\"rx__d\">Build toward roughly half your bodyweight split between both hands.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pagenum\"><span>khershberger.com<\u002Fspan><span>12 / 15<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section class=\"page\" data-screen-label=\"Build Your Week\">\n    <div class=\"pad\">\n      <div class=\"run\"><span class=\"run__brand\">The Longevity Lift Library<\u002Fspan><span class=\"run__ctx\">Build Your Week<\u002Fspan><\u002Fdiv>\n      <div style=\"margin-top:24px;\">\n        <div class=\"phead\">\n          <span class=\"eyebrow\">Section 02<\u002Fspan>\n          <h2 class=\"ptitle\">Putting It <em class=\"acc\">Together<\u002Fem><\u002Fh2>\n        <\u002Fdiv>\n        <p class=\"intro-lead\">Here's how to turn the menu into an actual week. Each template hits all six patterns — pick the one that matches the days you can train, run it with control, and add a rep or a little load every couple of weeks.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"plans\">\n        <div class=\"plan\">\n          <div class=\"plan__hd\"><div class=\"plan__freq\">2×<\u002Fdiv><div class=\"plan__split\">Per Week · Full Body<\u002Fdiv><\u002Fdiv>\n          <div class=\"plan__body\">\n            <div class=\"plan__day\"><div class=\"d\">Day A<\u002Fdiv><div class=\"m\">Squat · Push · Row · Reverse Lunge · Carry<\u002Fdiv><\u002Fdiv>\n            <div class=\"plan__day\"><div class=\"d\">Day B<\u002Fdiv><div class=\"m\">Deadlift · Overhead Press · Pull-Up · Hip Thrust · Lateral Lunge<\u002Fdiv><\u002Fdiv>\n            <div class=\"plan__day\"><div class=\"d\">Best For<\u002Fdiv><div class=\"m\">Busy weeks. Two efficient sessions that still cover every pattern.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"plan\">\n          <div class=\"plan__hd\"><div class=\"plan__freq\">3×<\u002Fdiv><div class=\"plan__split\">Per Week · Full Body<\u002Fdiv><\u002Fdiv>\n          <div class=\"plan__body\">\n            <div class=\"plan__day\"><div class=\"d\">Day 1 · Squat Focus<\u002Fdiv><div class=\"m\">Squat · Push · Row · Carry<\u002Fdiv><\u002Fdiv>\n            <div class=\"plan__day\"><div class=\"d\">Day 2 · Hinge Focus<\u002Fdiv><div class=\"m\">Deadlift · Overhead Press · Pull-Up · Hip Thrust<\u002Fdiv><\u002Fdiv>\n            <div class=\"plan__day\"><div class=\"d\">Day 3 · Single-Leg<\u002Fdiv><div class=\"m\">Lunge · Lateral Lunge · Push · Pull · Carry<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"plan\">\n          <div class=\"plan__hd\"><div class=\"plan__freq\">4×<\u002Fdiv><div class=\"plan__split\">Per Week · Upper / Lower<\u002Fdiv><\u002Fdiv>\n          <div class=\"plan__body\">\n            <div class=\"plan__day\"><div class=\"d\">Lower A<\u002Fdiv><div class=\"m\">Squat · Reverse Lunge · Hip Thrust<\u002Fdiv><\u002Fdiv>\n            <div class=\"plan__day\"><div class=\"d\">Upper A<\u002Fdiv><div class=\"m\">Push · Row · Pull-Up<\u002Fdiv><\u002Fdiv>\n            <div class=\"plan__day\"><div class=\"d\">Lower B<\u002Fdiv><div class=\"m\">Deadlift · Lateral Lunge · Carry<\u002Fdiv><\u002Fdiv>\n            <div class=\"plan__day\"><div class=\"d\">Upper B<\u002Fdiv><div class=\"m\">Overhead Press · Pull-Up · Row<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"reminder\">\n        <div class=\"reminder__bar\"><\u002Fdiv>\n        <div>\n          <div class=\"reminder__h\">The Progressive Overload Reminder<\u002Fdiv>\n          <p class=\"reminder__p\">Add a little each week — a rep, a few pounds, a touch more depth. <b>Your tissues adapt to demand, but only when that demand keeps climbing.<\u002Fb> When a lift starts to feel easy, that's your cue to make it harder.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pagenum\"><span>khershberger.com<\u002Fspan><span>13 / 15<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section class=\"page\" data-screen-label=\"The Library at a Glance\">\n    <div class=\"pad\">\n      <div class=\"run\"><span class=\"run__brand\">The Longevity Lift Library<\u002Fspan><span class=\"run__ctx\">Quick Reference<\u002Fspan><\u002Fdiv>\n      <div style=\"margin-top:24px;\">\n        <div class=\"phead\">\n          <span class=\"eyebrow\">Summary<\u002Fspan>\n          <h2 class=\"ptitle\">The Library at a <em class=\"acc\">Glance<\u002Fem><\u002Fh2>\n        <\u002Fdiv>\n        <p class=\"sum-note\">All ten lifts in one place, sorted by pattern. Use it to build a session at a glance — and on each lift, pick the level you can <b>own with clean, controlled form.<\u002Fb><\u002Fp>\n      <\u002Fdiv>\n      <table class=\"tbl\">\n        <colgroup><col class=\"c-lift\"><col class=\"c-pat\"><col class=\"c-tr\"><col class=\"c-do\"><\u002Fcolgroup>\n        <thead>\n          <tr><th>Lift<\u002Fth><th>Pattern<\u002Fth><th>Trains<\u002Fth><th>Weekly Dose<\u002Fth><\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n            <tr>\n              <td><div class=\"sn\"><span class=\"num\">01<\u002Fspan><span class=\"name\">Squat<\u002Fspan><\u002Fdiv><\u002Ftd>\n              <td class=\"cell\">Squat<\u002Ftd>\n              <td class=\"cell\">Quads · Glutes · Core · Ankles<\u002Ftd>\n              <td class=\"cell dose\">3 × 8–12<\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <td><div class=\"sn\"><span class=\"num\">02<\u002Fspan><span class=\"name\">Deadlift<\u002Fspan><\u002Fdiv><\u002Ftd>\n              <td class=\"cell\">Hinge<\u002Ftd>\n              <td class=\"cell\">Glutes · Hamstrings · Back · Grip<\u002Ftd>\n              <td class=\"cell dose\">3 × 6–8<\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <td><div class=\"sn\"><span class=\"num\">03<\u002Fspan><span class=\"name\">Lunge<\u002Fspan><\u002Fdiv><\u002Ftd>\n              <td class=\"cell\">Single-Leg<\u002Ftd>\n              <td class=\"cell\">Quads · Glutes · Hip Stabilizers · Balance<\u002Ftd>\n              <td class=\"cell dose\">3 × 8 / side<\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <td><div class=\"sn\"><span class=\"num\">04<\u002Fspan><span class=\"name\">Lateral Lunge<\u002Fspan><\u002Fdiv><\u002Ftd>\n              <td class=\"cell\">Frontal Plane<\u002Ftd>\n              <td class=\"cell\">Adductors · Glutes · Hip Mobility<\u002Ftd>\n              <td class=\"cell dose\">3 × 8 / side<\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <td><div class=\"sn\"><span class=\"num\">05<\u002Fspan><span class=\"name\">Horizontal Press<\u002Fspan><\u002Fdiv><\u002Ftd>\n              <td class=\"cell\">Horizontal Push<\u002Ftd>\n              <td class=\"cell\">Chest · Shoulders · Triceps · Core<\u002Ftd>\n              <td class=\"cell dose\">3 × 8–15<\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <td><div class=\"sn\"><span class=\"num\">06<\u002Fspan><span class=\"name\">Overhead Press<\u002Fspan><\u002Fdiv><\u002Ftd>\n              <td class=\"cell\">Vertical Push<\u002Ftd>\n              <td class=\"cell\">Shoulders · Upper Back · Triceps · Core<\u002Ftd>\n              <td class=\"cell dose\">3 × 8–10<\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <td><div class=\"sn\"><span class=\"num\">07<\u002Fspan><span class=\"name\">Pull-Up<\u002Fspan><\u002Fdiv><\u002Ftd>\n              <td class=\"cell\">Vertical Pull<\u002Ftd>\n              <td class=\"cell\">Lats · Biceps · Upper Back · Grip<\u002Ftd>\n              <td class=\"cell dose\">3 × 6–10<\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <td><div class=\"sn\"><span class=\"num\">08<\u002Fspan><span class=\"name\">Row<\u002Fspan><\u002Fdiv><\u002Ftd>\n              <td class=\"cell\">Horizontal Pull<\u002Ftd>\n              <td class=\"cell\">Upper Back · Lats · Biceps · Rear Delts<\u002Ftd>\n              <td class=\"cell dose\">3 × 8–12 / side<\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <td><div class=\"sn\"><span class=\"num\">09<\u002Fspan><span class=\"name\">Hip Thrust<\u002Fspan><\u002Fdiv><\u002Ftd>\n              <td class=\"cell\">Bridge / Hinge<\u002Ftd>\n              <td class=\"cell\">Glutes · Hamstrings · Posterior Chain<\u002Ftd>\n              <td class=\"cell dose\">3 × 8–12<\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <td><div class=\"sn\"><span class=\"num\">10<\u002Fspan><span class=\"name\">Loaded Carry<\u002Fspan><\u002Fdiv><\u002Ftd>\n              <td class=\"cell\">Loaded Carry<\u002Ftd>\n              <td class=\"cell\">Grip · Core · Trunk Stability · Traps<\u002Ftd>\n              <td class=\"cell dose\">3 trips · 40–60s<\u002Ftd>\n            <\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n      <div class=\"reminder\">\n        <div class=\"reminder__bar\"><\u002Fdiv>\n        <div>\n          <div class=\"reminder__h\">The Big Picture<\u002Fdiv>\n          <p class=\"reminder__p\">The best program is the one you'll still be doing in ten years.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pagenum\"><span>khershberger.com<\u002Fspan><span>14 / 15<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section class=\"page close\" data-screen-label=\"Train for the Decades Ahead\">\n    <div class=\"pad\">\n      <div class=\"close__run\"><span class=\"l\">The Longevity Lift Library<\u002Fspan><span class=\"r\">@dr.kevinhershberger<\u002Fspan><\u002Fdiv>\n      <div class=\"close__body\">\n        <div class=\"close__eyebrow\">Want More?<\u002Fdiv>\n        <h2 class=\"close__title\">Train for the<br>decades <em class=\"acc\">ahead.<\u002Fem><\u002Fh2>\n        <p class=\"close__lead\">This guide gives you the movements. My weekly newsletter gives you everything around them — the clinical research, the programming, and the movement principles I use with patients to keep them strong, mobile, and out of my clinic.<\u002Fp>\n        <div class=\"cta\">\n          <a class=\"cta__btn\" href=\"https://khershberger.com/newsletter\">khershberger.com/newsletter →<\u002Fa>\n          <span class=\"cta__note\">Free to subscribe. No spam.<br>Unsubscribe anytime.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"close__foot\">\n        <img class=\"close__avatar\" src=\"63f76bb0-4ccf-41b6-a788-3d91f7e84002\" alt=\"Dr. Kevin Hershberger\">\n        <div class=\"meta\">\n          <div class=\"who\">© 2026 Dr. Kevin Hershberger · DPT, FAAOMPT<\u002Fdiv>\n          <div class=\"disc\">For educational purposes only. Not medical advice. Consult a licensed provider before starting any new exercise program.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<script>\n/* Fit-to-width scaler for this fixed 816px (US Letter) print layout.\n   Wraps each .page in a .page-frame whose height collapses to the SCALED\n   height, then scales the page down to fit narrow viewports. This is the\n   only way to show a fixed-size page on a phone without horizontal scroll. */\n(function(){\n  var DESIGN_W = 816, DESIGN_H = 1056;\n  function fit(){\n    var pages = document.querySelectorAll('.page');\n    var vw = document.documentElement.clientWidth;           // excludes scrollbar\n    var sideGutter = vw <= 600 ? 0 : 24;                     // small breathing room on tablet+\n    var avail = Math.min(vw - sideGutter * 2, DESIGN_W);\n    var scale = avail / DESIGN_W;\n    for (var i = 0; i < pages.length; i++){\n      var p = pages[i];\n      var frame = p.parentElement;\n      if (!frame.classList.contains('page-frame')){\n        frame = document.createElement('div');\n        frame.className = 'page-frame';\n        p.parentNode.insertBefore(frame, p);\n        frame.appendChild(p);\n      }\n      if (scale < 0.999){\n        p.style.transform = 'scale(' + scale + ')';\n        frame.style.width  = (DESIGN_W * scale) + 'px';\n        frame.style.height = (DESIGN_H * scale) + 'px';\n      } else {\n        p.style.transform = '';\n        frame.style.width = '';\n        frame.style.height = '';\n      }\n    }\n  }\n  var raf;\n  function schedule(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(fit); }\n  window.addEventListener('resize', schedule);\n  window.addEventListener('orientationchange', schedule);\n  if (document.readyState === 'loading'){\n    document.addEventListener('DOMContentLoaded', fit);\n  } else { fit(); }\n  window.addEventListener('load', fit);   // re-fit after fonts/images settle\n})();\n<\u002Fscript>\n<\u002Fbody><\u002Fhtml>"
