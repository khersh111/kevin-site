  <script>
    initSharedLayout('golf');

    // Count the signup once, only when arriving from the /golf form (it sets this flag).
    (function () {
      var lead = null;
      try {
        lead = JSON.parse(sessionStorage.getItem('golf_lead') || 'null');
        sessionStorage.removeItem('golf_lead');
      } catch (e) {}
      if (!lead) return;
      try { window.va('event', { name: 'Golf waitlist signup', data: lead }); } catch (e) {}
      try { if (typeof fbq === 'function') fbq('track', 'Lead', { content_name: 'golf_waitlist' }); } catch (e) {}
    })();
