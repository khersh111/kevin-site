name: Publish newsletter

# Every Sunday, pull any newly-sent beehiiv issue and commit it to the site.
# You send at 7am Central; these run comfortably after that. The job is
# idempotent, so the second run each Sunday is just a safety net if the first
# ran before the issue was sent — it won't create duplicates.
#
# One-time setup: add your beehiiv API key as a repo secret named
# BEEHIIV_API_KEY  (Settings -> Secrets and variables -> Actions -> New secret).

on:
  schedule:
    - cron: '0 15 * * 0'   # 15:00 UTC Sun = 9am CST / 10am CDT
    - cron: '0 19 * * 0'   # 19:00 UTC Sun = 1pm CST / 2pm CDT (safety net)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only — do not commit'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-newsletter
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync newsletters from beehiiv
        id: sync
        env:
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          DEBUG_DUMP: '1'
        run: node scripts/sync-newsletters.js

      - name: Commit and push
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name  "Kevin Hershberger"
          git config user.email "kevinhershberger@users.noreply.github.com"
          git add newsletters.json images/newsletters
          git commit -m "Publish newsletter — ${{ steps.sync.outputs.summary }}"
          git push
