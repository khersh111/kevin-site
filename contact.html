    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Kevin Hershberger</title>
    <meta name="description" content="Get in touch with Dr. Kevin Hershberger. Questions about physical therapy, injury prevention, or content — reach out here.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="redesign.css">
    <script defer src="/_vercel/insights/script.js"></script>

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>
<body>
    <div id="nav-placeholder"></div>

    <section class="contact-page">
        <div class="contact-layout">
            <div class="contact-info anim-in">
                <span class="page-hero-label">Contact</span>
                <h1 class="contact-title">Get in <em>touch.</em></h1>
                <p class="contact-desc">Have a question about physical therapy, injury prevention, or just want to say hello? I'd love to hear from you.</p>
            </div>
            <div class="contact-form-wrap anim-in">
                <form class="contact-form" id="contact-form">
                    <div class="form-group">
                        <label for="contact-name">Name</label>
                        <input type="text" id="contact-name" name="name" class="form-input" placeholder="Your name" required>
                    </div>
                    <div class="form-group">
                        <label for="contact-email">Email</label>
                        <input type="email" id="contact-email" name="email" class="form-input" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="contact-message">Message</label>
                        <textarea id="contact-message" name="message" class="form-input form-textarea" placeholder="What's on your mind?" rows="6" required></textarea>
                    </div>
                    <!-- Honeypot: hidden from humans, bots fill it -->
                    <input type="text" name="company" id="contact-company" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;">
                    <button type="submit" class="form-submit" id="contact-submit">Send Message →</button>
                    <p id="contact-error" style="display:none;color:#e53e3e;font-size:0.9rem;margin-top:8px;"></p>
                </form>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>
    <script src="shared.js"></script>
    <script>
    initSharedLayout('contact');

    document.getElementById('contact-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('contact-submit');
        const errorEl = document.getElementById('contact-error');
        btn.textContent = 'Sending…';
        btn.disabled = true;
        errorEl.style.display = 'none';

        try {
            const res = await fetch('/api/contact', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('contact-name').value,
                    email: document.getElementById('contact-email').value,
                    message: document.getElementById('contact-message').value,
                    company: document.getElementById('contact-company').value,
                })
            });
            const data = await res.json();
            if (!res.ok) {
                errorEl.textContent = data.error || 'Something went wrong. Try again.';
                errorEl.style.display = 'block';
                btn.textContent = 'Send Message →';
                btn.disabled = false;
            } else {
                this.innerHTML = '<p style="font-size:1.1rem;font-weight:600;">Message sent! I\'ll get back to you soon.</p>';
            }
        } catch {
            errorEl.textContent = 'Network problem. Check your connection and try again.';
            errorEl.style.display = 'block';
            btn.textContent = 'Send Message →';
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
