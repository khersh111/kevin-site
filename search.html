<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search — Kevin Hershberger</title>
    <meta name="description" content="Search articles by Dr. Kevin Hershberger.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script defer src="/_vercel/insights/script.js"></script>

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>
<body>
    <div id="nav-placeholder"></div>

    <section class="search-page">
        <div class="search-inner">
            <h1 class="search-title anim-in">Search</h1>
            <div class="search-box anim-in">
                <input type="text" id="search-input" class="search-input" placeholder="Search articles..." autofocus>
                <span class="search-icon">⌕</span>
            </div>
            <div class="search-results" id="search-results">
                <p class="search-hint">Start typing to search across all articles, guides, book notes, and programs.</p>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>
    <script src="shared.js"></script>
    <script>
    const TYPE_LABELS = { article: 'Article', guide: 'Guide', book: 'Book Note', program: 'Program', newsletter: 'Newsletter' };

    // Groups of interchangeable terms so a search for one surfaces content that
    // only mentions a related term — e.g. "patella" finds knee content, and
    // "rotator cuff" finds shoulder content, even if the exact word isn't there.
    const SYNONYM_GROUPS = [
        ['knee', 'knees', 'patella', 'kneecap', 'meniscus', 'acl', 'mcl', 'quad', 'quads', 'quadriceps'],
        ['shoulder', 'shoulders', 'rotator', 'cuff', 'deltoid', 'scapula', 'scapular'],
        ['back', 'spine', 'spinal', 'lumbar', 'thoracic', 'lower-back'],
        ['hip', 'hips', 'glute', 'glutes', 'gluteal', 'piriformis'],
        ['ankle', 'ankles', 'achilles', 'calf', 'calves', 'shin', 'shins'],
        ['neck', 'cervical'],
        ['elbow', 'elbows'],
        ['wrist', 'wrists', 'carpal'],
        ['sleep', 'insomnia', 'rest'],
        ['stress', 'anxiety', 'cortisol'],
        ['posture', 'alignment', 'ergonomics'],
        ['mobility', 'flexibility', 'stretching', 'stretch'],
        ['strength', 'muscle', 'muscles', 'lifting', 'resistance'],
        ['injury', 'injuries', 'pain'],
    ];
    const SYNONYMS = {};
    SYNONYM_GROUPS.forEach(group => {
        group.forEach(word => { SYNONYMS[word] = group.filter(w => w !== word); });
    });

    // Naive singular/plural folding so "knee" and "knees" both match ("knees" -> "knee", "box" stays "box")
    function stem(word) {
        if (word.length > 3 && word.endsWith('es')) return word.slice(0, -2);
        if (word.length > 3 && word.endsWith('s') && !word.endsWith('ss')) return word.slice(0, -1);
        return word;
    }

    function tokenize(text) {
        return (text.toLowerCase().match(/[a-z0-9']+/g) || []);
    }

    const input = document.getElementById('search-input');
    const results = document.getElementById('search-results');

    let searchIndex = null;
    let indexError = false;

    fetch('/search-index.json')
        .then(res => { if (!res.ok) throw new Error('bad response'); return res.json(); })
        .then(data => {
            searchIndex = data.map(item => ({ ...item, titleTokens: tokenize(item.title) }));
            // Run any search that was queued while the index was loading
            const urlParams = new URLSearchParams(window.location.search);
            const qParam = urlParams.get('q');
            if (qParam) {
                input.value = qParam;
                doSearch();
            } else if (input.value.trim().length >= 2) {
                doSearch();
            }
        })
        .catch(() => {
            indexError = true;
            if (input.value.trim().length >= 2) doSearch();
        });

    let debounceTimer;
    input.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(doSearch, 200);
    });

    function scoreItem(item, qTokens, qTokenStems) {
        let score = 0;
        let distinctMatched = 0;

        const titleStems = item.titleTokens.map(stem);
        const categoryText = (item.category || '').toLowerCase();
        const authorText = (item.author || '').toLowerCase();
        const bodyTokens = item._bodyTokens || (item._bodyTokens = tokenize(item.text || ''));

        qTokens.forEach((qt, i) => {
            const qs = qTokenStems[i];
            let matchedThisTerm = false;

            // Title: exact word, stemmed, or prefix match (typing-in-progress)
            if (item.titleTokens.some((w, idx) => w === qt || titleStems[idx] === qs || (qt.length >= 3 && w.startsWith(qt)))) {
                score += 14;
                matchedThisTerm = true;
            }
            // Category / author
            if (categoryText.includes(qt) || authorText.includes(qt)) {
                score += 5;
                matchedThisTerm = true;
            }
            // Body text — count occurrences, capped so one term can't dominate
            const occurrences = bodyTokens.reduce((n, w) => (w === qt || stem(w) === qs) ? n + 1 : n, 0);
            if (occurrences > 0) {
                score += Math.min(occurrences, 5);
                matchedThisTerm = true;
            }

            // Synonyms — same checks, half weight, only if the direct term missed
            if (!matchedThisTerm) {
                const syns = SYNONYMS[qt] || SYNONYMS[qs] || [];
                for (const syn of syns) {
                    let synHit = false;
                    if (item.titleTokens.includes(syn)) { score += 7; synHit = true; }
                    if (categoryText.includes(syn)) { score += 2.5; synHit = true; }
                    const synOccurrences = bodyTokens.reduce((n, w) => w === syn ? n + 1 : n, 0);
                    if (synOccurrences > 0) { score += Math.min(synOccurrences, 5) * 0.5; synHit = true; }
                    if (synHit) matchedThisTerm = true;
                }
            }

            if (matchedThisTerm) distinctMatched++;
        });

        if (distinctMatched === 0) return 0;
        // Reward matching more of a multi-word query, without zeroing out partial matches
        const coverage = distinctMatched / qTokens.length;
        return score * (0.5 + 0.5 * coverage);
    }

    function buildSnippet(item, qTokens, qTokenStems) {
        const text = item.text || '';
        if (!text) return '';
        const lower = text.toLowerCase();
        let bestIndex = -1;
        for (let i = 0; i < qTokens.length && bestIndex === -1; i++) {
            const idx = lower.indexOf(qTokens[i]);
            if (idx !== -1) bestIndex = idx;
        }
        if (bestIndex === -1) return '';

        const radius = 90;
        const start = Math.max(0, bestIndex - radius);
        const end = Math.min(text.length, bestIndex + radius);
        let snippet = text.slice(start, end).trim();
        if (start > 0) snippet = '…' + snippet;
        if (end < text.length) snippet += '…';
        return highlightTerms(snippet, qTokens);
    }

    function escapeRegex(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function highlightTerms(text, terms) {
        const uniq = [...new Set(terms.filter(Boolean))].sort((a, b) => b.length - a.length);
        if (uniq.length === 0) return text;
        const regex = new RegExp(`(${uniq.map(escapeRegex).join('|')})`, 'gi');
        return text.replace(regex, '<mark>$1</mark>');
    }

    function doSearch() {
        const qRaw = input.value.trim();
        const q = qRaw.toLowerCase();
        if (q.length < 2) {
            results.innerHTML = '<p class="search-hint">Start typing to search across all articles, guides, book notes, and programs.</p>';
            return;
        }

        if (indexError) {
            results.innerHTML = '<p class="search-empty">Search is temporarily unavailable. Please try again shortly.</p>';
            return;
        }
        if (!searchIndex) {
            results.innerHTML = '<p class="search-hint">Loading search index…</p>';
            return;
        }

        const qTokens = tokenize(q);
        if (qTokens.length === 0) {
            results.innerHTML = '<p class="search-hint">Start typing to search across all articles, guides, book notes, and programs.</p>';
            return;
        }
        const qTokenStems = qTokens.map(stem);

        const scored = searchIndex
            .map(item => ({ item, score: scoreItem(item, qTokens, qTokenStems) }))
            .filter(r => r.score > 0)
            .sort((a, b) => b.score - a.score)
            .slice(0, 40);

        if (scored.length === 0) {
            results.innerHTML = `<p class="search-empty">No results for "<strong>${qRaw}</strong>"</p>`;
            return;
        }

        results.innerHTML = scored.map(({ item }) => {
            const snippet = buildSnippet(item, qTokens, qTokenStems);
            return `
            <a href="${item.url}" class="search-result">
                <span class="search-result-type">${TYPE_LABELS[item.type] || 'Page'}</span>
                <h3 class="search-result-title">${highlightTerms(item.title, qTokens)}</h3>
                <span class="search-result-cat">${item.author ? `${item.author} · ` : ''}${item.category}${item.date ? ` · ${item.date}` : ''}</span>
                ${snippet ? `<p class="search-result-excerpt">${snippet}</p>` : ''}
            </a>
        `;
        }).join('');
    }

    initSharedLayout('');
    </script>
</body>
</html>
