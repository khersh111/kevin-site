    ];

    const input = document.getElementById('search-input');
    const results = document.getElementById('search-results');

    // Auto-populate from URL string
    const urlParams = new URLSearchParams(window.location.search);
    const qParam = urlParams.get('q');
    if (qParam) {
        input.value = qParam;
        setTimeout(doSearch, 50); // slight delay to ensure DOM is ready
    }

    let debounceTimer;
    input.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(doSearch, 200);
    });

    const TYPE_LABELS = { article: 'Article', guide: 'Guide', book: 'Book Note', program: 'Program' };

    // Naive singular/plural folding so "knee" and "knees" both match ("knees" -> "knee", "box" stays "box")
    function stem(word) {
        if (word.length > 3 && word.endsWith('es')) return word.slice(0, -2);
        if (word.length > 3 && word.endsWith('s') && !word.endsWith('ss')) return word.slice(0, -1);
        return word;
    }

    function doSearch() {
        const q = input.value.trim().toLowerCase();
        if (q.length < 2) {
            results.innerHTML = '<p class="search-hint">Start typing to search across all articles, guides, book notes, and programs.</p>';
            return;
        }

        const qStem = stem(q);

        const matches = searchIndex.filter(item => {
            const haystack = [item.title, item.category, item.slug, item.keywords, item.author]
                .filter(Boolean)
                .join(' ')
                .toLowerCase();

            return haystack.split(/\s+/).some(word => word.includes(q) || stem(word).includes(qStem))
                || haystack.includes(q);
        });

        if (matches.length === 0) {
            results.innerHTML = `<p class="search-empty">No results for "<strong>${q}</strong>"</p>`;
            return;
        }

        results.innerHTML = matches.map(item => `
            <a href="${item.url}" class="search-result">
                <span class="search-result-type">${TYPE_LABELS[item.type] || 'Page'}</span>
                <h3 class="search-result-title">${highlight(item.title, q)}</h3>
                <span class="search-result-cat">${item.author ? `${item.author} · ` : ''}${item.category}</span>
            </a>
        `).join('');
    }

    function highlight(text, query) {
        const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        return text.replace(regex, '<mark>$1</mark>');
    }

    initSharedLayout('');
