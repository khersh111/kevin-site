<body>
    <div class="squeeze">
        <div class="squeeze-logo">KH<span class="squeeze-logo-dot">.</span></div>
        <span class="squeeze-label">Free Guide</span>
        <h1 class="squeeze-title">The <em>Golfer’s</em> Warm-Up.</h1>
        <p class="squeeze-desc">Seven dynamic exercises to do before the first tee to increase swing speed and decrease your odds of getting injured — enter your email and get instant access.</p>
        <form class="squeeze-form" id="squeeze-form" onsubmit="handleSubmit(event)">
            <input type="email" id="email" class="form-input" placeholder="Email address" autocomplete="email" required>
            <p class="squeeze-error" id="form-error" role="alert"></p>
            <button type="submit" class="form-submit" id="submit-btn">Get Free Guide →</button>
            <p class="squeeze-note">Free. No spam. Unsubscribe anytime.</p>
        </form>
        <hr class="squeeze-divider">
        <p class="squeeze-footer">By <a href="/">Dr. Kevin Hershberger</a> — Physical Therapist, DPT</p>
    </div>
    <script>
    async function handleSubmit(e) {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        const errorEl = document.getElementById('form-error');
        const email = document.getElementById('email').value.trim();
        const label = btn.textContent;
        errorEl.textContent = '';
        btn.textContent = 'Loading...';
        btn.disabled = true;
        try { window.va('event', { name: 'Golf warm-up signup submitted', data: { page: 'get-golf-warm-up' } }); } catch {}
        try {
            const res = await fetch('/api/subscribe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, utm_source: 'golf-warm-up' })
            });
            let data = {};
            try { data = await res.json(); } catch {}
            if (res.ok) {
                try { window.va('event', { name: 'Golf warm-up signup succeeded', data: { page: 'get-golf-warm-up' } }); } catch {}
                window.location.href = '/guide-golf-warm-up';
                return;
            }
            errorEl.textContent = data.message || 'Something went wrong. Please try again in a minute.';
        } catch {
            errorEl.textContent = 'We couldn’t connect. Check your connection and try again.';
        }
        btn.textContent = label;
        btn.disabled = false;
    }
    </script>
